<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Task 1</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <table>
    <caption>Student marksheet</caption>

    <colgroup>
      <col span="2" class="gray">
      <col span="3" class="blue">
      <col class="green">
    </colgroup>

    <thead>
      <tr>
        <th colspan="2">Student details</th>
        <th colspan="3">Subject marks (out of 100)</th>
        <th rowspan="2">Total<small>out of 300</small></th>
      </tr>
      <tr>
        <th>Roll no.</th>
        <th>Name</th>
        <th>HTML</th>
        <th>CSS</th>
        <th>JavaScript</th>
      </tr>
    </thead>

    <tbody>
      <tr><td>1</td><td>Asha</td><td>88</td><td>84</td><td>90</td><td>262</td></tr>
      <tr><td>2</td><td>Bikash</td><td>75</td><td>80</td><td>78</td><td>233</td></tr>
      <tr><td>3</td><td>Nisha</td><td>92</td><td>89</td><td>94</td><td>275</td></tr>
      <tr><td>4</td><td>Suman</td><td>68</td><td>72</td><td>70</td><td>210</td></tr>
    </tbody>

    <tfoot>
      <tr>
        <td colspan="5" class="label">Class average (out of 300)</td>
        <td class="avg">245</td>
      </tr>
    </tfoot>
  </table>
</body>
</html>
