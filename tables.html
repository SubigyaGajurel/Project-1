<!DOCTYPE html>
<html>
<head>
    <title>Tables</title>
</head>
<body>

    <h1>Employee Table</h1>
    <table border="2">
        <tr>
            <th>Name</th>
            <th>Phone</th>
            <th>Address</th>
            <th>Salary</th>
        </tr>
        <tr>
            <td>Ram</td>
            <td>9841000001</td>
            <td>KTM</td>
            <td>90K</td>
        </tr>
        <tr>
            <td>Sita</td>
            <td>9841000002</td>
            <td>Bhaktapur</td>
            <td>30K</td>
        </tr>
        <tr>
            <td>Hari</td>
            <td>9841000003</td>
            <td>Chitwan</td>
            <td>40K</td>
        </tr>
    </table>

    <br><br>

    <h2>Student Table</h2>
    <table border="2">
        <tr>
            <th rowspan="2">Roll No</th>
            <td>30</td>
            <td>22</td>
            <td>20</td>
        </tr>
        <tr>
            <th rowspan="3">Student Name</th>
            <td>Ram</td>
            <td>Sita</td>
            <td>Hari</td>
        </tr>
        <tr>
            <th>Marks</th>
            <td>40</td>
            <td>90</td>
            <td>50</td>
        </tr>
    </table>

</body>
</html>
